app = "pgpu"
bin = "pgpu"
grid = [120, 14]
frame = "window"
prompt = "$ "
typing = "30ms"
setup = "sh {app}/render/terminal/queue.sh {scratch}/demo"

[build]
command = "cargo build --release --locked --bin pgpu"
bin_dir = "{target}/release"

[env]
HOME = "home"
TMPDIR = "temp"
NO_COLOR = "1"

[theme]
name = "Catppuccin Mocha"
background = "#1e1e2e"
foreground = "#cdd6f4"
selection = "#45475a"
cursor = "#f5e0dc"
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
brightBlack = "#585b70"
brightRed = "#f38ba8"
brightGreen = "#a6e3a1"
brightYellow = "#f9e2af"
brightBlue = "#89b4fa"
brightMagenta = "#f5c2e7"
brightCyan = "#94e2d5"
brightWhite = "#a6adc8"

[shots.status]
kind = "clip"
line = "pgpu runs jobs in the GPU's lanes, says why the others wait, and hands a lane on when a job ends"
tape = "render/terminal/status.tape"
launch = "cd {scratch}/demo && export XDG_RUNTIME_DIR={scratch}/demo/run XDG_STATE_HOME={scratch}/demo/state XDG_CONFIG_HOME={scratch}/demo/config PATH={bin}:$PATH && set +m && clear"
settle = "400ms"
status = "SHIPPED"

[shots.turn]
kind = "clip"
line = "a render in passes calls pgpu turn between them, and an interactive job waiting for the one lane gets in at the next turn"
tape = "render/terminal/turn.tape"
launch = "cd {scratch}/demo && export XDG_RUNTIME_DIR={scratch}/demo/run XDG_STATE_HOME={scratch}/demo/state XDG_CONFIG_HOME={scratch}/demo/config PATH={bin}:$PATH && printf 'GPU_SLOTS=1\\n' > config/pgpu/config && set +m && clear"
settle = "400ms"
status = "SHIPPED"

[shots.limits]
kind = "clip"
line = "a job past its memory ceiling is killed with exit 137, and a job at twice its run-time budget is stopped with exit 124"
tape = "render/terminal/limits.tape"
launch = "cd {scratch}/demo && export XDG_RUNTIME_DIR={scratch}/demo/run XDG_STATE_HOME={scratch}/demo/state XDG_CONFIG_HOME={scratch}/demo/config PATH={bin}:$PATH && unset NO_COLOR && set +m && clear"
settle = "400ms"
status = "SHIPPED"

[shots.json]
kind = "clip"
line = "scripts and agents read the queue with pgpu status --json"
tape = "render/terminal/json.tape"
launch = "cd {scratch}/demo && export XDG_RUNTIME_DIR={scratch}/demo/run XDG_STATE_HOME={scratch}/demo/state XDG_CONFIG_HOME={scratch}/demo/config PATH={bin}:$PATH && set +m && clear"
settle = "400ms"
status = "SHIPPED"
