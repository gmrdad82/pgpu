[package]
name = "pgpu"
version = "0.31.3"
edition = "2024"
rust-version = "1.97"
description = "Share one GPU between jobs and agents: a queue with lanes, turns, budgets and memory ceilings"
license = "MIT"
repository = "https://github.com/gmrdad82/pgpu"
homepage = "https://pitomd.com"
readme = "README.md"
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6", features = ["derive"] }
humantime = "2.4.0"
libc = "0.2"

[lib]
name = "pgpu"
path = "src/lib.rs"

[[bin]]
name = "pgpu"
path = "src/main.rs"

[profile.release]
opt-level = 3
