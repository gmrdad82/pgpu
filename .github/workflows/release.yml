name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            archive: tar.gz
            exe: pgpu
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
      NAME: pgpu-${{ github.ref_name }}-${{ matrix.asset }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: the tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG is not v$version" >&2; exit 1; }
      - run: cargo build --release --locked --target "$TARGET"
      - name: pack
        run: |
          mkdir -p dist/pack
          cp "target/$TARGET/release/$EXE" LICENSE README.md dist/pack/
          cd dist/pack
          tar -czf "../$NAME" "$EXE" LICENSE README.md
      - name: docs bundle
        run: PGPU_BIN="target/$TARGET/release/$EXE" bin/docs-bundle dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ env.NAME }}
            dist/docs-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum pgpu-* docs-* > SHA256SUMS && cat SHA256SUMS
      - name: notes from the changelog
        run: |
          awk -v version="${TAG#v}" '
            /^## / { if (found) exit; if (index($0, version)) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for $TAG" >&2; exit 1; }
          cat notes.md
      - name: release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
